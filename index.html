<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Şəkər Çap Görüntüsü</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="toolbar">
    <label class="btn">
      G-code aç
      <input id="file" type="file" accept=".gcode,.gco,.g,text/plain" hidden>
    </label>
    <button id="play" class="btn" disabled>Dayandır</button>
    <label class="color">
      Rəng
      <input id="color" type="color" value="#e8a33d">
    </label>
    <span id="info">G-code və ya şəkil faylını bura atın</span>
  </div>

  <details id="panel" open>
    <summary>Şəkildən G-code</summary>

    <label class="btn wide">
      Şəkil yüklə
      <input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
    </label>

    <canvas id="preview" width="240" height="240"></canvas>
    <p id="previewNote" class="note">Hələ şəkil yoxdur</p>

    <div class="row">
      <label for="width">En (mm)</label>
      <input id="width" type="number" min="5" max="150" step="1" value="40">
    </div>
    <div class="row">
      <label for="layers">Qat sayı</label>
      <input id="layers" type="number" min="1" max="10" step="1" value="1">
    </div>
    <div class="row">
      <label for="mode">Şəkər olsun</label>
      <select id="mode">
        <option value="dark">Tünd hissələr</option>
        <option value="alpha">Şəffaf olmayan hissə</option>
      </select>
    </div>
    <div class="row" id="thresholdRow">
      <label for="threshold">Həssaslıq</label>
      <input id="threshold" type="range" min="1" max="254" value="128">
    </div>
    <div class="row">
      <label for="invert">Tərsinə çevir</label>
      <input id="invert" type="checkbox">
    </div>

    <button id="generate" class="btn wide primary" disabled>G-code yarat</button>
    <button id="download" class="btn wide" disabled>Endir</button>
    <p class="note">0.6 mm-dən incə detallar çap olunmur. İlk dəfə kiçik ölçü və 1 qatla sınayın.</p>
  </details>

  <div id="drop">Faylı bura atın</div>

  <script type="module" src="main.js"></script>
</body>
</html>
